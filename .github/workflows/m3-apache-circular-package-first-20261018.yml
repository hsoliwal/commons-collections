# SPDX-License-Identifier: Apache-2.0
name: M3 package-first Apache circular FIFO source parity
on:
  pull_request:
    paths:
      - 'src/main/java/com/m3/collections/apache/BoundedCollection.java'
      - 'src/main/java/com/m3/collections/apache/queue/CircularFifoQueue.java'
      - 'src/test/java/com/m3/collections/apache/queue/M3ApacheCircularFifoRelocationProof.java'
      - 'm3/package-first/apache-circular-20261018/**'
      - '.github/workflows/m3-apache-circular-package-first-20261018.yml'
  workflow_dispatch:
jobs:
  exact-java21-relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact original and canonical generated output hashes
        run: |
          set -eu
          SRC=target/m3-original-source/src/main/java/org/apache/commons/collections4
          OUT=src/main/java/com/m3/collections/apache
          Q=m3/package-first/apache-circular-20261018/recipe
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          pin='6404dfdfe553097bb934e044034abcec5a4dbdd0'
          legacy=Path('target/m3-original-source')
          source_paths=[
              'src/main/java/org/apache/commons/collections4/BoundedCollection.java',
              'src/main/java/org/apache/commons/collections4/queue/CircularFifoQueue.java',
              'src/test/java/com/m3/collections/apache/queue/M3ApacheCircularFifoRelocationProof.java']
          for relative in source_paths:
              output=legacy/relative
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(subprocess.check_output(['git','show',pin+':'+relative]))
          src=legacy/'src/main/java/org/apache/commons/collections4'
          out=Path('src/main/java/com/m3/collections/apache')
          a=(src/'BoundedCollection.java').read_text(encoding='utf-8')
          b=(src/'queue/CircularFifoQueue.java').read_text(encoding='utf-8')
          assert (out/'BoundedCollection.java').read_text(encoding='utf-8') == a.replace(
              'package org.apache.commons.collections4;', 'package com.m3.collections.apache;')
          assert (out/'queue/CircularFifoQueue.java').read_text(encoding='utf-8') == b.replace(
              'package org.apache.commons.collections4.queue;', 'package com.m3.collections.apache.queue;'
          ).replace('import org.apache.commons.collections4.BoundedCollection;',
                    'import com.m3.collections.apache.BoundedCollection;')
          q=Path('m3/package-first/apache-circular-20261018/recipe')
          for line in (q/'manifest.tsv').read_text().splitlines():
              target,before_hash,after_hash,template=line.split('\t')
              current=(legacy/target if target.endswith('M3ApacheCircularFifoRelocationProof.java') else Path(target))
              assert hashlib.sha256(current.read_bytes()).hexdigest()==after_hash,target
          print('PASS pinned original owners and genuine original-versus-relocated oracle; bodies unchanged')
          PY
          awk -F '\t' -v q="$Q" '{print $3 "  " q "/" $4}' "$Q/manifest.tsv" | sha256sum -c -
      - name: Compile actual original plus relocated Java21 owners
        run: |
          set -eu
          SRC=target/m3-original-source/src/main/java/org/apache/commons/collections4
          OUT=src/main/java/com/m3/collections/apache
          TST=target/m3-original-source/src/test/java/com/m3/collections/apache/queue
          mkdir -p target/m3-relocation/classes
          javac --release 21 -proc:none -Xlint:all,-this-escape,-serial -Werror \
            -d target/m3-relocation/classes \
            "$SRC/BoundedCollection.java" "$SRC/queue/CircularFifoQueue.java" \
            "$OUT/BoundedCollection.java" "$OUT/queue/CircularFifoQueue.java" \
            "$TST/M3ApacheCircularFifoRelocationProof.java"
          java -ea -cp target/m3-relocation/classes \
            com.m3.collections.apache.queue.M3ApacheCircularFifoRelocationProof
