# SPDX-License-Identifier: Apache-2.0
name: M3 Commons indexed-ring differential
on:
  pull_request:
    paths:
      - 'src/main/java/com/m3/collections/apache/queue/CircularFifoQueue.java'
      - 'src/test/java/com/m3/collections/apache/queue/M3CircularFifoQueueIndexTest.java'
      - 'src/test/java/com/m3/collections/apache/queue/CircularFifoQueueContainsHotPathTest.java'
      - 'src/test/java/com/m3/collections/apache/queue/CircularFifoQueueRemoveHotPathTest.java'
      - '.github/workflows/m3-arrayification-ring-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wrapped-index-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact canonical source postimages
        shell: bash
        run: |
          set -euo pipefail
          printf '3dc7770e623c712045a4d48d243c3266ce068aeac016cfe11a9d82f70e706318  %s\n' 'src/main/java/com/m3/collections/apache/queue/CircularFifoQueue.java' | sha256sum -c -
          printf '9da28e29eb0b3ff45859192c1fb65c2257847a148b84d8710b1d32e5ef916016  %s\n' 'src/test/java/com/m3/collections/apache/queue/M3CircularFifoQueueIndexTest.java' | sha256sum -c -
      - name: Execute actual scoped Commons JUnit test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -Dtest=M3CircularFifoQueueIndexTest,CircularFifoQueueContainsHotPathTest,CircularFifoQueueRemoveHotPathTest test
      - name: Require real JUnit, no failures or skips
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=[]
          for name in ('M3CircularFifoQueueIndexTest', 'CircularFifoQueueContainsHotPathTest', 'CircularFifoQueueRemoveHotPathTest'):
              matching=list(Path('target/surefire-reports').glob('TEST-*'+name+'*.xml'))
              assert matching,'NO_REAL_JUNIT_REPORT_'+name
              files.extend(matching)
          a=[0,0,0,0]
          for f in files:
              e=ET.parse(f).getroot()
              a=[x+int(e.attrib.get(k,'0')) for x,k in zip(a,('tests','failures','errors','skipped'))]
          assert a[0]>=1 and a[1:]==[0,0,0],a
          print('COMMONS_RING_CONTRACT_PASS',a)
          PY
      - name: Upload exact JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-commons-array-ring
          if-no-files-found: warn
          path: target/surefire-reports/
