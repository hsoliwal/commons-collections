# SPDX-License-Identifier: Apache-2.0
name: Commons Collections source-array superset (Java 8 API / JDK 21 tests)
on:
  pull_request:
    paths:
      - '.github/workflows/m3-commons-array-superset-20261113.yml'
      - 'src/main/java/com/m3/collections/apache/bloomfilter/**'
      - 'src/main/java/com/m3/collections/apache/ArrayStack.java'
      - 'src/main/java/com/m3/collections/apache/bag/AbstractMapBag.java'
      - 'src/main/java/com/m3/collections/apache/multimap/AbstractMultiValuedMap.java'
      - 'src/main/java/com/m3/collections/apache/multiset/AbstractMapMultiSet.java'
      - 'src/main/java/com/m3/collections/apache/list/TreeList.java'
      - 'src/main/java/com/m3/collections/apache/list/SetUniqueList.java'
      - 'src/main/java/com/m3/collections/apache/map/StaticBucketMap.java'
      - 'src/main/java/com/m3/collections/apache/map/AbstractHashedMap.java'
      - 'src/main/java/com/m3/collections/apache/queue/CircularFifoQueue.java'
      - 'src/test/java/com/m3/collections/apache/bloomfilter/**'
      - 'src/test/java/com/m3/collections/apache/ArrayStackDirectSearchTest.java'
      - 'src/test/java/com/m3/collections/apache/bag/MapBagSpanArrayExportTest.java'
      - 'src/test/java/com/m3/collections/apache/multimap/ArrayListValuedHashMapEntryCursorTest.java'
      - 'src/test/java/com/m3/collections/apache/multiset/MapMultiSetSpanArrayExportTest.java'
      - 'src/test/java/com/m3/collections/apache/list/TreeListThreadedIndexLookupTest.java'
      - 'src/test/java/com/m3/collections/apache/list/TreeListTypedArray*.java'
      - 'src/test/java/com/m3/collections/apache/list/SetUniqueListBulkRemovalTest.java'
      - 'src/test/java/com/m3/collections/apache/map/StaticBucketArray*.java'
      - 'src/test/java/com/m3/collections/apache/map/AbstractHashedMapArrayHotPathTest.java'
      - 'src/test/java/com/m3/collections/apache/iterators/M3ZippingIteratorIndexedRingTest.java'
      - 'src/test/java/com/m3/collections/apache/queue/CircularFifoQueueFullOverwriteTest.java'
      - 'src/test/java/com/m3/collections/apache/queue/CircularFifoQueueBulkArrayTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-array-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm original Commons Java 8 source floor
        run: |
          java -version
          mvn -B -ntp -DskipTests compile
      - name: Require all native fork array-owner JUnit classes
        run: |
          mvn -B -ntp -Dmaven.compiler.testRelease=21 -Dtest=TreeListThreadedIndexLookupTest,TreeListTypedArrayTest,CircularFifoQueueFullOverwriteTest,CircularFifoQueueContainsHotPathTest,CircularFifoQueueRemoveHotPathTest,ArrayCountingBloomFilterMaskTest,ArrayCountingBloomFilterMaskExportTest,BitmapHotPathTest,MapBagSpanArrayExportTest,MapMultiSetSpanArrayExportTest,ArrayListValuedHashMapEntryCursorTest,ArrayStackDirectSearchTest,StaticBucketArrayTest,AbstractHashedMapArrayHotPathTest,SetUniqueListBulkRemovalTest,CircularFifoQueueBulkArrayTest,M3ZippingIteratorIndexedRingTest,ZippingIteratorArrayStorageTest test
      - name: Full original Commons Maven qualification
        run: mvn -B -ntp -Dmaven.compiler.testRelease=21 verify
      - name: Provider source and API metadata validation
        run: |
          git diff --check "$(git merge-base HEAD origin/master)" HEAD
          test -f target/surefire-reports/TEST-com.m3.collections.apache.bloomfilter.ArrayCountingBloomFilterMaskExportTest.xml
          test -f target/surefire-reports/TEST-com.m3.collections.apache.list.TreeListTypedArrayTest.xml
