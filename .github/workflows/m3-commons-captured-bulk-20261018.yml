# SPDX-License-Identifier: Apache-2.0
name: M3 Commons captured dynamic-array bulk contract
on:
  pull_request:
    paths:
      - 'src/main/java/org/apache/commons/collections4/collection/PredicatedCollection.java'
      - 'src/test/java/org/apache/commons/collections4/collection/M3PredicatedBulkCaptureTest.java'
      - 'm3scale/qualifications/m3-commons-predicated-bulk-capture-20261018/**'
      - '.github/workflows/m3-commons-captured-bulk-20261018.yml'
  workflow_dispatch:
jobs:
  real-commons-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact canonical Synexia output parity
        run: python3 m3scale/qualifications/m3-commons-predicated-bulk-capture-20261018/verify.py
      - name: Real Apache Commons Maven/JUnit and Java 8 source contract
        run: mvn -B -ntp -Dtest=M3PredicatedBulkCaptureTest,PredicatedCollectionTest test
